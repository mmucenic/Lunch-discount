name: Scrape deals

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour
  workflow_dispatch:        # also triggerable manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated JSON back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scrapers
        run: npm run scrape

      - name: Commit updated deals (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/scraped-deals.json
          # Only commit if the file actually changed
          git diff --staged --quiet && echo "No changes, skipping commit" && exit 0
          git commit -m "chore: update scraped deals [skip ci]"
          git push
